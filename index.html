<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rayan Upadhyay's Games</title>
<meta name="description" content="Free browser games, no downloads. Collected by Rayan Upadhyay.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1a1a1a; --muted: #666; --line: #ddd; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #fff; color: var(--ink); font-family: "Rubik", system-ui, sans-serif; font-size: 17px; line-height: 1.4; }
  [hidden] { display: none !important; }
  a { color: inherit; }

  /* header */
  .head { position: relative; text-align: center; padding: 64px 20px 8px; }
  .pills { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none; background: #fff;
    border: 2px solid var(--line); border-radius: 12px; padding: 7px 14px; font-weight: 500;
  }
  .pill:hover, .pill:focus-visible { border-color: var(--ink); outline: none; }
  .logo { margin: 0; font-family: "Permanent Marker", cursive; line-height: 0.95; font-weight: 400; }
  .logo .top { display: block; font-size: clamp(22px, 4.2vw, 40px); letter-spacing: 0.02em; }
  .logo .main { display: inline-flex; align-items: center; gap: 0.12em; font-size: clamp(64px, 14vw, 140px); }
  .logo .joy { font-size: 0.55em; display: inline-block; transform: rotate(10deg); }
  .tagline { margin: 10px 0 0; font-size: 1.25em; color: #333; }

  /* controls */
  .bar {
    position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,0.94);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-bottom: 2px solid var(--line);
  }
  .bar-in { max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search {
    flex: 1 1 220px; max-width: 360px; font: inherit; padding: 9px 14px;
    border: 2.5px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink);
  }
  .search:focus { outline: 3px solid #2563c9; outline-offset: 2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
  .chip {
    flex: none; font: 500 0.95em "Rubik", sans-serif; cursor: pointer; white-space: nowrap;
    border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 14px; background: #fff; color: var(--ink);
    box-shadow: 0 3px 0 var(--ink);
  }
  .chip:hover { background: #f3f3f3; }
  .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chip:focus-visible { outline: 3px solid #2563c9; outline-offset: 3px; }

  /* sections */
  main { max-width: 1240px; margin: 0 auto; padding: 10px 24px 40px; }
  .sec { margin-top: 44px; }
  .sec-h { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .sec-h h2 {
    margin: 0; font: 400 clamp(26px, 3.4vw, 36px) "Permanent Marker", cursive;
    background: var(--c); color: var(--ci); padding: 2px 16px 4px; border: 3px solid var(--ink);
    border-radius: 12px; transform: rotate(-1.5deg);
  }
  .sec-h .count { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px; }
  .card {
    display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 5px 0 var(--ink); transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover { transform: translateY(-4px) rotate(-1deg); box-shadow: 0 9px 0 var(--ink); }
  .card:nth-child(even):hover { transform: translateY(-4px) rotate(1deg); }
  .card:focus-visible { outline: 3px solid #2563c9; outline-offset: 4px; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #eee; border-bottom: 3px solid var(--ink); }
  .card span { padding: 8px 10px 10px; font-weight: 700; font-size: 0.95em; line-height: 1.2; background: var(--c); color: var(--ci); flex: 1; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 1.15em; }

  footer { max-width: 1240px; margin: 0 auto; padding: 30px 24px 50px; color: var(--muted); text-align: center; border-top: 2px solid var(--line); }
  footer p { margin: 6px 0; }

  /* player */
  .player { position: fixed; inset: 0; z-index: 20; background: #111; display: flex; flex-direction: column; }
  .p-bar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff;
    border-bottom: 3px solid var(--ink); flex-wrap: wrap;
  }
  .p-title { flex: 1; min-width: 0; margin: 0; font: 400 clamp(20px, 3vw, 30px) "Permanent Marker", cursive; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    font: 500 0.95em "Rubik", sans-serif; cursor: pointer; text-decoration: none; white-space: nowrap;
    border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 14px; background: #fff; color: var(--ink);
    box-shadow: 0 3px 0 var(--ink); display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #f3f3f3; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn:focus-visible { outline: 3px solid #2563c9; outline-offset: 3px; }
  .p-stage { position: relative; flex: 1; }
  .p-stage .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; font-size: 1.2em; }
  .p-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }

  @media (max-width: 640px) {
    .pills { position: static; justify-content: center; margin-bottom: 18px; }
    .head { padding-top: 18px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 16px; }
    .bar-in, main { padding-left: 16px; padding-right: 16px; }
    .p-bar .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover, .card:nth-child(even):hover { transform: none; }
  }
</style>
</head>
<body>
<div id="home">
  <header class="head">
    <nav class="pills" aria-label="My other sites">
      <a class="pill" href="https://links.rayanupadhyay.com">🔗 links</a>
      <a class="pill" href="https://tools.rayanupadhyay.com">🧰 tools</a>
    </nav>
    <h1 class="logo"><span class="top">Rayan Upadhyay's</span><span class="main">GAMES<span class="joy" aria-hidden="true">🕹️</span></span></h1>
    <p class="tagline" id="tagline">free games, no downloads. just click and play.</p>
  </header>

  <div class="bar">
    <div class="bar-in">
      <input class="search" id="search" type="search" placeholder="Search games..." aria-label="Search games" autocomplete="off">
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    </div>
  </div>

  <main id="list"></main>

  <footer>
    <p>Made by Rayan. Game collection from <a href="https://github.com/Gams-Offline/Gams" target="_blank" rel="noopener">Gams</a> by mountain658. Flash games run on <a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a>.</p>
    <p>All games belong to their original creators.</p>
  </footer>
</div>

<div class="player" id="player" hidden>
  <div class="p-bar">
    <a class="btn" href="#" id="pBack">← all games</a>
    <h2 class="p-title" id="pTitle"></h2>
    <button class="btn" id="pFull" type="button">⛶ <span class="hide-sm">fullscreen</span></button>
    <a class="btn hide-sm" id="pNew" href="#" target="_blank" rel="noopener">↗ new tab</a>
  </div>
  <div class="p-stage">
    <div class="loading">loading...</div>
    <iframe id="pFrame" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
  </div>
</div>

<script>
const LIST = [{"section": "Basic"}, {"name": "Stickman Hook", "href": "g/stickmanhook.html", "img": "img/stickmanhook.png"}, {"name": "Drive Mad", "href": "g/g/drivemad/drivemad.html", "img": "img/drivemad.png"}, {"name": "2048", "href": "g/2048.html", "img": "img/2048.png"}, {"name": "Cookie Clicker", "href": "g/g/cookie/index.html", "img": "img/cookieclicker.png"}, {"name": "Cube Field", "href": "g/g/cubefield/index.html", "img": "img/cubefield.png"}, {"name": "Spacebar Clicker", "href": "g/spacebarclicker.html", "img": "img/spacebarclicker.png"}, {"name": "Offline Paradise", "href": "g/offlineparadise.html", "img": "img/offlineparadise.png"}, {"name": "Sand Game", "href": "g/sandgame.html", "img": "img/sandgame.png"}, {"name": "Agario Lite", "href": "g/agariolite.html", "img": "img/agariolite.png"}, {"name": "Evil Glitch", "href": "g/evilglitch.html", "img": "img/evilglitch.png"}, {"name": "Its Raining Boxes", "href": "g/itsrainingboxes.html", "img": "img/itsrainingboxes.png"}, {"name": "T Rex", "href": "g/trex.html", "img": "img/trex.png"}, {"name": "Stack", "href": "g/stack.html", "img": "img/stack.png"}, {"name": "Rolling Forests", "href": "g/rollingforests.html", "img": "img/rollingforests.png"}, {"name": "Radius Raid", "href": "g/radiusraid.html", "img": "img/radiusraid.png"}, {"name": "Mountain Maze", "href": "g/mountainmaze.html", "img": "img/mountainmaze.png"}, {"name": "Fluid Simulator", "href": "g/fluidsimulator.html", "img": "img/fluidsimulator.png"}, {"name": "Edge Not Found", "href": "g/edgenotfound.html", "img": "img/edgenotfound.png"}, {"name": "Ninja vs EVILCORP", "href": "g/ninjavsevilcorp.html", "img": "img/ninjavsevilcorp.png"}, {"name": "Geometry Dash", "href": "g/geometrydash.html", "img": "img/geometrydash.png"}, {"name": "Wordle", "href": "g/wordle.html", "img": "img/wordle.png"}, {"name": "Paper IO 2", "href": "g/paperio2.html", "img": "img/paperio2.png"}, {"section": "Unity"}, {"name": "Slope", "href": "g/slope.html", "img": "img/slope.png"}, {"name": "Burrito Bison", "href": "g/g/burritobison/burritobison.html", "img": "img/burritobison.png"}, {"name": "Tube Jumpers", "href": "g/tubejumpers.html", "img": "img/tubejumpers.png"}, {"name": "Hole IO", "href": "g/holeio.html", "img": "img/holeio.png"}, {"name": "Madalin Stunt Cars", "href": "g/g/madalinstuntcars/madalinstuntcars.html", "img": "img/madalinstuntcars.png"}, {"name": "Glass City", "href": "g/g/glasscity/glasscity.html", "img": "img/glasscity.png"}, {"name": "Tunnel Rush", "href": "g/g/tunnelrush/tunnelrush.html", "img": "img/tunnelrush.png"}, {"name": "Tanuki Sunset", "href": "g/g/tanukisunset/tanukisunset.html", "img": "img/tanukisunset.png"}, {"name": "A Dance of Fire and Ice", "href": "g/g/fireice/index.html", "img": "img/adanceoffireandice.png"}, {"name": "Game Inside a Game", "href": "g/g/gameinsideagame/index.html", "img": "img/gameinsideagame.png"}, {"name": "Cell Machine", "href": "g/g/cellmachine/index.html", "img": "img/cellmachine.png"}, {"name": "Slope 2", "href": "g/g/slope2/index.html", "img": "img/slope2.png"}, {"name": "Ai Creatures", "href": "g/g/aicreatures/index.html", "img": "img/aicreatures.png"}, {"name": "Grey Box Testing", "href": "g/g/greybox/index.html", "img": "img/greyboxtesting.png"}, {"section": "Retrogaming"}, {"name": "Celeste", "href": "g/celeste.html", "img": "img/celeste.png"}, {"name": "Just One Boss", "href": "g/justoneboss.html", "img": "img/justoneboss.png"}, {"section": "Henry Stickmin Flash"}, {"name": "Breaking The Bank", "href": "g/breakingthebank.html", "img": "img/breakingthebank.png"}, {"name": "Escaping The Prison", "href": "g/escapingtheprison.html", "img": "img/escapingtheprison.png"}, {"name": "Stealing The Diamond", "href": "g/stealingthediamond.html", "img": "img/stealingthediamond.png"}, {"name": "Infiltrating The Airship", "href": "g/infiltratingtheairship.html", "img": "img/infiltratingtheairship.png"}, {"name": "Fleeing The Complex", "href": "g/fleeingthecomplex.html", "img": "img/fleeingthecomplex.png"}, {"section": "Flash"}, {"name": "Bloxorz", "href": "g/bloxorz.html", "img": "img/bloxorz.png"}, {"name": "Tetris", "href": "g/tetris.html", "img": "img/tetris.png"}, {"name": "Flood Runner 4", "href": "g/floodrunner4.html", "img": "img/floodrunner4.png"}, {"name": "Raft Wars", "href": "g/raftwars.html", "img": "img/raftwars.png"}, {"name": "Raft Wars 2", "href": "g/raftwars2.html", "img": "img/raftwars2.png"}, {"name": "Worlds Hardest Game", "href": "g/worldshardestgame.html", "img": "img/worldshardestgame.png"}, {"name": "The Impossible Quiz", "href": "g/theimpossiblequiz.html", "img": "img/theimpossiblequiz.png"}, {"name": "Learn To Fly Idle", "href": "g/learntoflyidle.html", "img": "img/learntoflyidle.png"}, {"name": "Learn To Fly 1", "href": "g/learntofly1.html", "img": "img/learntofly1.png"}, {"name": "Learn To Fly 2", "href": "g/learntofly2.html", "img": "img/learntofly2.png"}, {"name": "Learn To Fly 3", "href": "g/learntofly3.html", "img": "img/learntofly3.png"}, {"name": "Bloons Tower Defense 1", "href": "g/bloonstowerdefense1.html", "img": "img/bloonstowerdefense1.png"}, {"name": "Bloons Tower Defense 2", "href": "g/bloonstowerdefense2.html", "img": "img/bloonstowerdefense2.png"}, {"name": "Bloons Tower Defense 5", "href": "g/bloonstowerdefense5.html", "img": "img/bloonstowerdefense5.png"}, {"name": "Cat Ninja", "href": "g/catninja.html", "img": "img/catninja.png"}, {"name": "Pacman", "href": "g/pacman.html", "img": "img/pacman.png"}, {"name": "1 on 1 Soccer", "href": "g/1on1soccer.html", "img": "img/1on1soccer.png"}, {"name": "QWOP", "href": "g/qwop.html", "img": "img/qwop.png"}, {"name": "Use Boxmen", "href": "g/useboxmen.html", "img": "img/useboxmen.png"}, {"name": "40x Escape", "href": "g/40xescape.html", "img": "img/40xescape.png"}, {"name": "Stickman Life", "href": "g/stickmanlife.html", "img": "img/stickmanlife.png"}, {"name": "Duck Life 1", "href": "g/ducklife1.html", "img": "img/ducklife1.png"}, {"name": "Duck Life 2", "href": "g/ducklife2.html", "img": "img/ducklife2.png"}, {"name": "Duck Life 3", "href": "g/ducklife3.html", "img": "img/ducklife3.png"}, {"name": "Duck Life 4", "href": "g/ducklife4.html", "img": "img/ducklife4.png"}, {"name": "Duck Life 5", "href": "g/ducklife5.html", "img": "img/ducklife5.png"}, {"section": "Tools"}, {"name": "Ruffle Flash Player", "href": "g/g/Ruffle/Ruffle.html", "img": "img/ruffleflashplayer.png"}, {"name": "Code Editor", "href": "g/codeeditor.html", "img": "img/codeeditor.png", "type": "raw"}];

const SECTIONS = {
  "Basic":                { label: "Arcade",          c: "#ffd95a", ci: "#1a1a1a" },
  "Unity":                { label: "3D Games",        c: "#2563c9", ci: "#fff" },
  "Retrogaming":          { label: "Pixel Games",     c: "#e8443a", ci: "#fff" },
  "Henry Stickmin Flash": { label: "Henry Stickmin",  c: "#1f7a4a", ci: "#fff" },
  "Flash":                { label: "Flash Classics",  c: "#f59e0b", ci: "#1a1a1a" },
  "Tools":                { label: "Extras",          c: "#e6e8ee", ci: "#1a1a1a" }
};

/* build game objects */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const games = [];
let sec = "";
LIST.forEach(item => {
  if (item.section) { sec = item.section; return; }
  games.push({ ...item, id: slug(item.name), sec });
});
const byId = Object.fromEntries(games.map(g => [g.id, g]));
const realCount = games.filter(g => g.sec !== "Tools").length;
document.getElementById("tagline").textContent = `${realCount} free games, no downloads. just click and play.`;

const store = {
  get(k, d) { try { const v = localStorage.getItem("rayan-games:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("rayan-games:" + k, JSON.stringify(v)); } catch {} }
};

/* filters */
let filter = "all";
const chips = document.getElementById("chips");
const chipDefs = [["all", "All"], ["recent", "Recently played"], ...Object.entries(SECTIONS).map(([k, v]) => [k, v.label])];
chipDefs.forEach(([key, label]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.dataset.key = key; b.textContent = label;
  b.addEventListener("click", () => { filter = key; render(); });
  chips.appendChild(b);
});

function card(g) {
  const s = SECTIONS[g.sec] || SECTIONS.Tools;
  const a = document.createElement("a");
  a.className = "card";
  a.href = "#" + g.id;
  a.style.setProperty("--c", s.c);
  a.style.setProperty("--ci", s.ci);
  if (g.type === "raw") { a.href = g.href; a.target = "_blank"; a.rel = "noopener"; }
  const img = document.createElement("img");
  img.src = g.img; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
  const name = document.createElement("span");
  name.textContent = g.name;
  a.append(img, name);
  return a;
}

function section(title, list, colors) {
  const wrap = document.createElement("section");
  wrap.className = "sec";
  wrap.style.setProperty("--c", colors.c);
  wrap.style.setProperty("--ci", colors.ci);
  const h = document.createElement("div"); h.className = "sec-h";
  const h2 = document.createElement("h2"); h2.textContent = title;
  const n = document.createElement("span"); n.className = "count"; n.textContent = list.length === 1 ? "1 game" : `${list.length} games`;
  h.append(h2, n);
  const grid = document.createElement("div"); grid.className = "grid";
  list.forEach(g => grid.appendChild(card(g)));
  wrap.append(h, grid);
  return wrap;
}

function render() {
  chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.key === filter ? "true" : "false"));
  const q = document.getElementById("search").value.trim().toLowerCase();
  const out = document.getElementById("list");
  out.textContent = "";
  const match = g => !q || g.name.toLowerCase().includes(q);
  const recent = store.get("recent", []).map(id => byId[id]).filter(Boolean);

  if (filter === "recent") {
    const list = recent.filter(match);
    if (list.length) out.appendChild(section("Recently played", list, { c: "#ffd6e8", ci: "#1a1a1a" }));
    else out.innerHTML = '<p class="empty">Nothing here yet. Play something and it\u2019ll show up here.</p>';
    return;
  }
  if (filter === "all" && !q && recent.length) {
    out.appendChild(section("Recently played", recent.slice(0, 6), { c: "#ffd6e8", ci: "#1a1a1a" }));
  }
  let shown = 0;
  Object.entries(SECTIONS).forEach(([key, s]) => {
    if (filter !== "all" && filter !== key) return;
    const list = games.filter(g => g.sec === key && match(g));
    if (!list.length) return;
    shown += list.length;
    out.appendChild(section(s.label, list, s));
  });
  if (!shown) {
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = `No games match \u201c${q}\u201d. Try a different word.`;
    out.appendChild(p);
  }
}
document.getElementById("search").addEventListener("input", render);

/* player */
const player = document.getElementById("player");
const frame = document.getElementById("pFrame");
let homeScroll = 0;
function route() {
  const g = byId[location.hash.slice(1)];
  if (g && g.type !== "raw") {
    if (player.hidden) homeScroll = window.scrollY;
    document.getElementById("pTitle").textContent = g.name;
    document.getElementById("pNew").href = g.href;
    if (frame.getAttribute("src") !== g.href) frame.src = g.href;
    player.hidden = false;
    document.body.style.overflow = "hidden";
    document.title = g.name + " | Rayan Upadhyay's Games";
    const recent = [g.id, ...store.get("recent", []).filter(id => id !== g.id)].slice(0, 12);
    store.set("recent", recent);
    setTimeout(() => frame.focus(), 300);
  } else {
    if (!player.hidden) {
      player.hidden = true;
      frame.removeAttribute("src");
      document.body.style.overflow = "";
      document.title = "Rayan Upadhyay's Games";
      render();
      requestAnimationFrame(() => window.scrollTo(0, homeScroll));
    }
  }
}
document.getElementById("pFull").addEventListener("click", () => {
  const el = frame;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});
window.addEventListener("hashchange", route);

render();
route();
</script>
</body>
</html>
